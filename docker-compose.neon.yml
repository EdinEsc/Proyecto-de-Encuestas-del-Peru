services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voting_backend_neon
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PORT: ${BACKEND_PORT:-8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@votaciones.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
    container_name: voting_frontend_neon
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
